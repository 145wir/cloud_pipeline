services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cloud-backend

    environment:
      REDIS_URL: redis://redis:6379/0

    env_file:
      - .env

    depends_on:
      - redis

    networks:
      - app-network

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile

    container_name: image_rag_frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - app-network

    restart: unless-stopped


  redis:
    image: redis:7

    container_name: cloud-redis

    networks:
      - app-network

    restart: unless-stopped


networks:
  app-network:
    driver: bridge